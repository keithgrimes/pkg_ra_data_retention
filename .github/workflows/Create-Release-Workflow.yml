name: Data Retention Package Build and Release Workflow
run-name: Data Retention Build🚀
on: [push, workflow_dispatch]
jobs:
  Create-Release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Move to the working directory
        run: pushd ${{ github.workspace }}
      - name: Get Version for the Release
        run: php .github/workflows/GetBuildVersion.php package/pkg_ra_data_retention.xml ${{ github.ref }} version VERSION
      - name: show the version found
        run: echo "Version Found is ${{ env.VERSION }}"
      - name: Update the versions on the subcomponents to match the package version
        run: | 
          php .github/workflows/SetReleaseDetail.php package/pkg_ra_data_retention.xml package/components/com_ra_data_retention/com_ra_data_retention.xml version version
          php .github/workflows/SetReleaseDetail.php package/pkg_ra_data_retention.xml package/components/plg_ra_data_retention/dataretention.xml version version
      - name: Create the package zip file for the release
        run: | 
          cd package/components
          zip -r ${{ github.workspace }}/com_ra_data_retention.zip com_ra_data_retention
          zip -r ${{ github.workspace }}/plg_ra_data_retention.zip plg_ra_data_retention
          cd ${{ github.workspace }}
          mkdir pkg_ra_data_retention
          mkdir pkg_ra_data_retention/components
          cp com_ra_data_retention.zip pkg_ra_data_retention/components/
          cp plg_ra_data_retention.zip pkg_ra_data_retention/components/
          cp package/pkg_ra_data_retention.xml pkg_ra_data_retention/
          zip -r pkg_ra_data_retention-${{ env.VERSION }}.zip pkg_ra_data_retention
      - name: List the files in the repository
        run: ls -al

      - name: Create GitHub Release with Auto-Generated Notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generateReleaseNotes: true  # Auto-generate release notes based on PRs and commits
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "pkg_ra_data_retention-${{ env.VERSION }}.zip"
